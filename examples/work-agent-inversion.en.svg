 fill="none" stroke="#a9afaa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1135 335L1265 335" fill="none" stroke="#579260" stroke-width="5" stroke-linecap="round"/><path d="M1251 345L1265 335L1251 325" fill="none" stroke="#579260" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g id="text-layer" data-language="en" data-layout="before-after" data-style="editorial"><text x="50" y="105" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="760" text-anchor="start"><tspan x="50" dy="0">BEFORE: AGENT FOR A</tspan><tspan x="50" dy="42.5">PROFESSIONAL</tspan></text><text x="50" y="181.5" fill="#a9afaa" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="560" text-anchor="start"><tspan x="50" dy="0">Define the human role and workflow first, then add an agent</tspan><tspan x="50" dy="20">to improve individual efficiency.</tspan></text><text x="860" y="105" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="760" text-anchor="start"><tspan x="860" dy="0">AFTER: HUMANS AROUND THE</tspan><tspan x="860" dy="42.5">AGENT</tspan></text><text x="860" y="181.5" fill="#579260" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="560" text-anchor="start"><tspan x="860" dy="0">A strong marketing agent executes specialist work while</tspan><tspan x="860" dy="20">people close the loops of judgment, relationships, and</tspan><tspan x="860" dy="20">accountability.</tspan></text><g id="before-after-stage-marketer-text"><text x="210" y="485" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="760" text-anchor="middle"><tspan x="210" dy="0">MARKETER</tspan></text><text x="122" y="551" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="122" dy="0">Role and workflow first</tspan></text><text x="122" y="589" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="122" dy="0">Human executes</tspan></text></g><g id="before-after-stage-assistant-text"><text x="590" y="485" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="760" text-anchor="middle"><tspan x="590" dy="0">MARKETING AGENT</tspan></text><text x="502" y="551" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="502" dy="0">Search, generate,</tspan><tspan x="502" dy="21.25">analyze</tspan></text><text x="502" y="589" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="502" dy="0">Improve efficiency</tspan></text></g><g id="before-after-stage-strong-agent-text"><text x="1010" y="485" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="760" text-anchor="middle"><tspan x="1010" dy="0">STRONG MARKETING</tspan><tspan x="1010" dy="30">AGENT</tspan></text><text x="922" y="551" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="922" dy="0">Continuous execution</tspan></text><text x="922" y="589" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="922" dy="0">Own specialist workflow</tspan></text></g><g id="before-after-stage-human-loop-text"><text x="1390" y="485" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="760" text-anchor="middle"><tspan x="1390" dy="0">HUMAN LOOP</tspan></text><text x="1302" y="551" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="1302" dy="0">Judgment and brand</tspan></text><text x="1302" y="589" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="1302" dy="0">Relationships and</tspan><tspan x="1302" dy="21.25">accountability</tspan></text></g><text x="800" y="835" fill="#d95335" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">THE CENTER SHIFTS FROM THE HUMAN ROLE TO THE LOOPS THE</tspan><tspan x="800" dy="30">AGENT CANNOT CLOSE ALONE</tspan></text></g></svg>
