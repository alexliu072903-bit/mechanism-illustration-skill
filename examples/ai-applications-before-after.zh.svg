an-life"><circle cx="1010" cy="335" r="116" fill="#e8f7f8"/><path d="M968 273h58l28 28v96h-86z" fill="#fff" stroke="#151815" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1026 273v28h28M986 320h48M986 341h48M986 362h34" fill="none" stroke="#151815" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="904" cy="545" r="7" fill="#579260"/><circle cx="904" cy="583" r="7" fill="#579260"/></g><g id="before-after-stage-native-product"><circle cx="1390" cy="335" r="116" fill="#e8f7f8"/><rect x="1318" y="273" width="144" height="124" rx="14" fill="#e8f7f8" stroke="#151815" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="1335" y="295" width="28" height="28" rx="4" fill="#579260"/><path d="M1342 309l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g><rect x="1335" y="337" width="28" height="28" rx="4" fill="#579260"/><path d="M1342 351l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M1378 308h62M1378 350h62" fill="none" stroke="#151815" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1284" cy="545" r="7" fill="#579260"/><circle cx="1284" cy="583" r="7" fill="#579260"/></g><path d="M335 335L465 335" fill="none" stroke="#a9afaa" stroke-width="5" stroke-linecap="round"/><path d="M451 345L465 335L451 325" fill="none" stroke="#a9afaa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1135 335L1265 335" fill="none" stroke="#579260" stroke-width="5" stroke-linecap="round"/><path d="M1251 345L1265 335L1251 325" fill="none" stroke="#579260" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g id="text-layer" data-language="zh" data-layout="before-after" data-style="editorial"><text x="50" y="105" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="760" text-anchor="start"><tspan x="50" dy="0">AI+：替换旧工具</tspan></text><text x="50" y="138" fill="#a9afaa" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="560" text-anchor="start"><tspan x="50" dy="0">模型能力进入旧产品，但人的行为、流程和关系基本不变。</tspan></text><text x="860" y="105" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="760" text-anchor="start"><tspan x="860" dy="0">AI NATIVE：重构产品</tspan></text><text x="860" y="138" fill="#579260" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="560" text-anchor="start"><tspan x="860" dy="0">把持续存在的智能视为基础设施，重新设计行为、工作流与生活</tspan><tspan x="860" dy="20">方式。</tspan></text><g id="before-after-stage-old-workflow-text"><text x="210" y="485" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="760" text-anchor="middle"><tspan x="210" dy="0">旧工作流</tspan></text><text x="122" y="551" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="122" dy="0">既有角色与步骤</tspan></text><text x="122" y="589" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="122" dy="0">既有组织方式</tspan></text></g><g id="before-after-stage-ai-layer-text"><text x="590" y="485" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="760" text-anchor="middle"><tspan x="590" dy="0">增加 AI 能力</tspan></text><text x="502" y="551" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="502" dy="0">生成或执行单次任务</tspan></text><text x="502" y="589" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="502" dy="0">功能容易被模型吸收</tspan></text></g><g id="before-after-stage-human-life-text"><text x="1010" y="485" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="760" text-anchor="middle"><tspan x="1010" dy="0">真实生活与工作</tspan></text><text x="922" y="551" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="922" dy="0">行为、关系与判断</tspan></text><text x="922" y="589" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="922" dy="0">尚未被表达的需求</tspan></text></g><g id="before-after-stage-native-product-text"><text x="1390" y="485" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="760" text-anchor="middle"><tspan x="1390" dy="0">重构产品系统</tspan></text><text x="1302" y="551" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="1302" dy="0">智能持续存在</tspan></text><text x="1302" y="589" fill="#151815" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="560" text-anchor="start"><tspan x="1302" dy="0">重新组织工作与生活</tspan></text></g><text x="800" y="835" fill="#d95335" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">基础设施让产品成为可能，但不会自动发明产品</tspan></text></g></svg>
